<!DOCTYPE html>
<html manifest="700.manifest">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imam &nbsp;&nbsp;x&nbsp;&nbsp; Playbox PS4 - Cache 7.00-8.52</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1 class="main-title">
                <span class="name-imam">Imam &nbsp;x&nbsp; Playbox</span>
                <span class="ps4-title">PS4</span>
            </h1>
            <div class="subtitle">Exploit Host</div>
            <div class="version-badge">FW 7.00 - 8.52</div>
        </header>
        
        <hr class="separator">
        
        <div class="status-bar">
            <span id="msgs" class="status-text loading">Starting Cache Installation...</span>
        </div>
        
        <footer>
            <p class="credit">Designed by <a href="#" class="credit-link">Imam &nbsp;x&nbsp; Playbox</a></p>
            <p class="thanks">Special thanks to all scene developers</p>
        </footer>
    </div>

    <script>
        // ======== نفس المنطق الأصلي - مع history.replaceState ========
        history.replaceState(null, null, 'index.html');
        var histlength = history.length;
        history.go(-histlength);
        
        var msgs = document.getElementById('msgs');
        
        function DLProgress(e) {
            var Percent = Math.round(e.loaded / e.total * 100);
            msgs.innerHTML = "Installing Offline Cache: " + Percent + "%";
        }
        
        function DisplayCacheProgress() {
            msgs.innerHTML = "Cache Installed Successfully ✔";
            msgs.className = "status-text success";
            setTimeout(function() {
                msgs.innerHTML = "Now Close And Re-Open Your Browser ...";
            }, 1500);
        }
        
        window.applicationCache.addEventListener("progress", DLProgress, false);
        window.applicationCache.oncached = function(e) { DisplayCacheProgress(); };
        window.applicationCache.onupdateready = function(e) { DisplayCacheProgress(); };
        window.applicationCache.onerror = function(e) {
            msgs.innerHTML = "Error Installing Cache! - Clear and Re-Open Your Browser ...";
            msgs.className = "status-text error";
        };
    </script>
</body>
</html>
